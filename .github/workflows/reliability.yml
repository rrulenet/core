name: Recurrence reliability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        timezone: [UTC, America/New_York, Pacific/Kiritimati]
    runs-on: ubuntu-latest
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm run typecheck
      - run: npm run build
      - name: Select execution runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Test compiled artifacts
        run: node --test test/**/*.test.js
      - name: Exercise non-ISO calendars
        if: matrix.node == 24 && matrix.timezone == 'UTC'
        run: node --import ./test/support/full-calendar.js --test test/**/*.test.js
